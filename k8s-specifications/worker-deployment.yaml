apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
    team: voting-app
    env: production
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        team: voting-app
        env: production
    spec:
      containers:
      - image: worker:1.0
        name: worker
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
