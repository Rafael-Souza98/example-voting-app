apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
    team: voting-app
    env: production
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
        team: voting-app
        env: production
    spec:
      containers:
      - image: dockersamples/examplevotingapp_result
        name: result
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        ports:
        - containerPort: 80
          name: result
